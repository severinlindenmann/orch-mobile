name: Orch
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  OrchKit:
    path: OrchKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 77D4THRYUN
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Orch:
    type: application
    platform: iOS
    sources:
      - App
      # the share extension's status screens, rendered by the DEBUG share-status route (step 16 layout checks)
      - path: ShareExtension/ShareStatusViews.swift
        group: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.severin.orch
        CODE_SIGN_ENTITLEMENTS: App/Orch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: orch
        # Export compliance (owner decision 2026-10-11, decisions.md T4): all crypto goes through Apple CryptoKit.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OrchAppIdentifierPrefix: $(AppIdentifierPrefix)
        UILaunchScreen: {}
        # The `orch://pair?relay=<origin>#v2...` pairing link (decisions D-3). An open only ever lands on a review screen.
        CFBundleURLTypes:
          - CFBundleURLName: io.severin.orch.pair
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [orch]
        NSCameraUsageDescription: orch uses the camera only to scan the pairing QR code shown by orch on your Mac.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - package: OrchKit
        products: [OrchProtocol, OrchCustody, OrchStore, OrchCoordination, OrchShareStaging, OrchPush, OrchClient, OrchFakeHost, OrchUI]
      - target: OrchNotify
        embed: true
      - target: OrchShare
        embed: true
  OrchNotify:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.severin.orch.notify
        CODE_SIGN_ENTITLEMENTS: NotificationService/OrchNotify.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: orch notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OrchAppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    dependencies:
      - package: OrchKit
        product: OrchPush
  OrchShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.severin.orch.share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/OrchShare.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: orch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # One OR'd predicate (a dictionary rule ANDs its keys, which hid the extension for image-only shares from Photos).
            # public.data/url/text cover everything ProviderStager imports (files, images, movies, links, text). The count bound
            # mirrors ShareLimits.maxItems but is PER extension item (one NSExtensionItem with more than 5 attachments does not
            # activate); the overall 5-item cap across items is still enforced by ProviderStager/ShareModel.save.
            NSExtensionActivationRule: >-
              SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment,
              (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.data"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text")).@count >= 1).@count >= 1
              AND SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment,
              (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.data"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text")).@count > 5).@count == 0
    dependencies:
      - package: OrchKit
        products: [OrchUI, OrchCoordination, OrchShareStaging]
  OrchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
      # test-only push fixtures (test keys), shared with scripts/make-push-fixture.swift and OrchPushTests
      - path: OrchKit/Tests/OrchPushFixtures/PushFixtures.swift
        group: PushFixtures
    dependencies:
      - target: Orch
      - package: OrchKit
        products: [OrchProtocol, OrchCustody, OrchPush, OrchCoordination, OrchShareStaging]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.severin.orch.tests
        GENERATE_INFOPLIST_FILE: YES
  OrchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Orch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.severin.orch.uitests
        GENERATE_INFOPLIST_FILE: YES
  # The Simulator dev-sandbox variant (host 11A.17, C2b increment 5): the same app code with `ORCH_DEV_SANDBOX` set, for pairing a Simulator
  # with a throwaway `dev-pair up --sim-convenience` sandbox and answering with a software key (convenience). iphonesimulator only, its own
  # bundle id, keychain group and App Group, no extensions, no push, no `orch://` link. Debug only: OrchKit's lane is compiled only under
  # `DEBUG && targetEnvironment(simulator)`, so there is deliberately no Release configuration of this target to build.
  OrchDevSandbox:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, Orch.entitlements]
      - path: ShareExtension/ShareStatusViews.swift
        group: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.severin.orch.devsandbox
        PRODUCT_NAME: OrchDevSandbox
        CODE_SIGN_ENTITLEMENTS: DevSandbox/OrchDevSandbox.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG ORCH_DEV_SANDBOX"
    info:
      path: DevSandbox/Info.plist
      properties:
        CFBundleDisplayName: orch sandbox
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OrchAppIdentifierPrefix: $(AppIdentifierPrefix)
        # the variant's own keychain access groups (`<team>.io.severin.orch.devsandbox.keys|push`): never the normal app's
        OrchKeychainGroupBase: io.severin.orch.devsandbox
        UILaunchScreen: {}
        NSCameraUsageDescription: orch uses the camera only to scan the pairing QR code shown by dev-pair on your Mac.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - package: OrchKit
        products: [OrchProtocol, OrchCustody, OrchStore, OrchCoordination, OrchShareStaging, OrchPush, OrchClient, OrchFakeHost, OrchUI]
  OrchDevSandboxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DevSandboxTests]
    dependencies:
      - target: OrchDevSandbox
      - package: OrchKit
        products: [OrchProtocol, OrchClient]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.severin.orch.devsandbox.tests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: iphonesimulator
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG ORCH_DEV_SANDBOX"
schemes:
  Orch:
    build:
      targets:
        Orch: all
    test:
      targets: [OrchTests, OrchUITests]
      parallelizeBuild: false
      randomExecutionOrder: false
  OrchDevSandbox:
    build:
      targets:
        OrchDevSandbox: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [OrchDevSandboxTests]
      parallelizeBuild: false
      randomExecutionOrder: false
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug
