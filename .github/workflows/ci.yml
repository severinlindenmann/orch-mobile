name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # a draft runs nothing heavy; marking it ready runs everything
concurrency:
  # Draft-event runs and full runs are separate groups: a quick skipped run (push to a draft) must never cancel a full
  # run (ready_for_review, or a push to a ready PR). Within a group the newer run still cancels the older one.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft && 'draft' || 'full' }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read  # the `mode` job reads the PR's live draft state

env:
  # Passed into the simulator test host as CI, so hosted keychain tests fail instead of skip.
  TEST_RUNNER_CI: '1'
  XCODE_VERSION: '16.4'
  XCODEGEN_VERSION: '2.46.0'
  XCODEGEN_SHA256: '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'

jobs:
  mode:
    # Cheap Linux job: decides from the PR's LIVE draft state (the event payload can be stale when a push and
    # `gh pr ready` race), so one `gh pr ready` reliably yields one full run on the current head.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      heavy: ${{ steps.m.outputs.heavy }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heavy=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            d=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" -q .draft)
            [ "$d" = true ] && heavy=false
          fi
          echo "draft=${d:-n/a} heavy=$heavy"; echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
  core:
    needs: mode
    if: needs.mode.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Select pinned Xcode
        run: |
          test -d "/Applications/Xcode_${XCODE_VERSION}.app"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
      # Serial on purpose: Swift Testing otherwise runs all ~760 tests at once on the runner's 3 cores, which starved the
      # cooperative pool until the job hit its timeout (run 38212117388). Serial takes minutes, never 30.
      # LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 limits the pool to one thread, so any code that blocks a pool thread
      # while waiting for async work (the semaphore in PushSliceTests that caused that hang) deadlocks on every run
      # instead of now and then; the step timeout then fails it.
      - run: swift test --package-path OrchKit --no-parallel
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        timeout-minutes: 20
      - run: scripts/check-no-test-hooks.sh
      - name: Generated retry table is current
        run: python3 OrchKit/Scripts/gen_retry_table.py --check
      - run: scripts/check-extension-links.sh
      - run: scripts/test-check-extension-links.sh
  app:
    needs: mode
    if: needs.mode.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Select pinned Xcode
        run: |
          test -d "/Applications/Xcode_${XCODE_VERSION}.app"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project and audit extensions
        run: |
          test "$(xcodegen --version)" = "Version: ${XCODEGEN_VERSION}"
          xcodegen generate
          scripts/check-extension-links.sh
          scripts/test-check-extension-links.sh
      - name: Select iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/devices.json') as source:
              devices = json.load(source)['devices']
          candidates = [d for runtime, values in sorted(devices.items())
                        if 'iOS-18-' in runtime for d in values
                        if d['isAvailable'] and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iOS 18 iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_ID=' + candidates[0]['udid'] + '\n')
          PY
      # NOTE: CODE_SIGNING_ALLOWED=NO strips entitlements, so hosted keychain tests would skip.
      # The hosted steps therefore sign ad hoc (CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES).
      # The Release build below needs no entitlements and stays unsigned.
      - name: Build for hosted tests
        run: >-
          xcodebuild -project Orch.xcodeproj -scheme Orch
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath .build/dd CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
          -only-testing:OrchTests build-for-testing
      - name: Run hosted tests
        run: >-
          xcodebuild -project Orch.xcodeproj -scheme Orch
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath .build/dd CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
          -only-testing:OrchTests test-without-building
      - name: Build Release configuration
        run: >-
          xcodebuild -project Orch.xcodeproj -scheme Orch
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath .build/dd-release -configuration Release
          CODE_SIGNING_ALLOWED=NO build
      - name: Release ignores debug launch flags
        run: scripts/check-release-flags.sh
  lane:
    needs: mode
    if: needs.mode.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Select pinned Xcode
        run: |
          test -d "/Applications/Xcode_${XCODE_VERSION}.app"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project and audit extensions
        run: |
          test "$(xcodegen --version)" = "Version: ${XCODEGEN_VERSION}"
          xcodegen generate
          scripts/check-extension-links.sh
          scripts/test-check-extension-links.sh
      - name: Select iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/devices.json') as source:
              devices = json.load(source)['devices']
          candidates = [d for runtime, values in sorted(devices.items())
                        if 'iOS-18-' in runtime for d in values
                        if d['isAvailable'] and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iOS 18 iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_ID=' + candidates[0]['udid'] + '\n')
          PY
      # C2b increment 5 (host 11A.17): the Simulator dev-sandbox lane exists only in a Debug Simulator build, and only the variant turns it on.
      # Its own job so the `app` job keeps its 45 minute budget. Each test step logs to a file and asserts a minimum executed-test count
      # (scripts/assert-test-count.sh), so a filter that matches nothing cannot pass.
      - name: Dev-sandbox variant tests (6 tests)
        run: |
          set -o pipefail
          xcodebuild -project Orch.xcodeproj -scheme OrchDevSandbox \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath .build/dd-variant-test CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:OrchDevSandboxTests test 2>&1 | tee "$RUNNER_TEMP/variant.log"
          scripts/assert-test-count.sh "$RUNNER_TEMP/variant.log" 6 "variant tests"
      - name: Dev-sandbox lane package tests (Simulator, 12 tests)
        run: |
          set -o pipefail
          cd OrchKit
          xcodebuild -scheme OrchKit-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath ../.build/dd-kit \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:OrchFakeHostTests/DevSandboxLaneTests test 2>&1 | tee "$RUNNER_TEMP/lane.log"
          cd ..
          scripts/assert-test-count.sh "$RUNNER_TEMP/lane.log" 11 "lane suite"
      - name: No lane symbols outside the variant
        run: scripts/check-dev-sandbox-symbols.sh
