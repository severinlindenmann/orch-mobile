name: E2E nightly
# Simulator pairs with a sandbox host through relay.dev, answers a question, the host checks the answer (scripts/e2e/sim-pair-answer.sh).
# Never on pull_request: it uses repo secrets and creates a sandbox account on relay.dev per run.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      core_ref:
        description: orch-core ref to test against
        default: develop
        required: false
        type: string
concurrency:
  group: e2e-nightly
  cancel-in-progress: false
permissions:
  contents: read

env:
  XCODE_VERSION: '16.4'
  XCODEGEN_VERSION: '2.46.0'
  XCODEGEN_SHA256: '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'

jobs:
  sim-pair-answer:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/checkout@v4.2.2
        with:
          repository: severinlindenmann/orch-core
          ref: ${{ inputs.core_ref || 'develop' }}
          path: orch-core
          persist-credentials: false
      - name: Select pinned Xcode
        run: |
          test -d "/Applications/Xcode_${XCODE_VERSION}.app"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
      - name: Sync orch-core environment
        working-directory: orch-core/plugins/orch-core
        run: uv sync --locked
      - name: Select iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/devices.json') as source:
              devices = json.load(source)['devices']
          candidates = [d for runtime, values in sorted(devices.items())
                        if 'iOS-18-' in runtime for d in values
                        if d['isAvailable'] and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iOS 18 iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('ORCH_E2E_SIM_UDID=' + candidates[0]['udid'] + '\n')
          PY
      - name: Write the invite key and pinned host key
        env:
          INVITE_KEY: ${{ secrets.ORCH_E2E_INVITE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORCH_E2E_KNOWN_HOSTS }}
        run: |
          set +x
          umask 077
          mkdir -p "$HOME/.e2e-secrets"
          printf '%s\n' "$INVITE_KEY" > "$HOME/.e2e-secrets/invite_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.e2e-secrets/known_hosts"
          chmod 600 "$HOME/.e2e-secrets/invite_key" "$HOME/.e2e-secrets/known_hosts"
          test -s "$HOME/.e2e-secrets/invite_key" && test -s "$HOME/.e2e-secrets/known_hosts"
          {
            echo "ORCH_E2E_INVITE_KEY_FILE=$HOME/.e2e-secrets/invite_key"
            echo "ORCH_E2E_KNOWN_HOSTS=$HOME/.e2e-secrets/known_hosts"
          } >> "$GITHUB_ENV"
      - name: Run sim-pair-answer
        env:
          ORCH_CORE_DIR: ${{ github.workspace }}/orch-core
          ORCH_E2E_INVITE_HOST: orch-invite@179.237.125.155
        run: |
          # Short root under $HOME (the control socket path must fit 100 bytes; /tmp is refused): $HOME/e2e is the script default.
          scripts/e2e/sim-pair-answer.sh 2>&1 | tee "$RUNNER_TEMP/sim-pair-answer.log"
          exit "${PIPESTATUS[0]}"
      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          cp "$RUNNER_TEMP/sim-pair-answer.log" "$RUNNER_TEMP/e2e-logs/" 2>/dev/null || true
          # the per-step logs (build, up, xcodebuild, ...); the invite file is deleted by the script and never copied
          for f in "$HOME"/e2e/spa/*.log; do [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/e2e-logs/"; done
          find .build/dd-e2e/Logs/Test -name '*.xcresult' -maxdepth 1 -exec cp -R {} "$RUNNER_TEMP/e2e-logs/" \; 2>/dev/null || true
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: e2e-nightly-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7
          if-no-files-found: ignore
